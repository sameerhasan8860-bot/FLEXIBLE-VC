name: FLEXIBLE-VC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flexible-vc-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      DB_NAME: ${{ secrets.DB_NAME }}
      SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
      LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libopus0 libasound2-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run audio unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate configuration
        run: python -c "from config import validate_config; validate_config(); print('Configuration looks present')"
      - name: Start FLEXIBLE-VC
        run: python bot.py
